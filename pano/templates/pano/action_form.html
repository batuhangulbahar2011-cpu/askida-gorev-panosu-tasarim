<form class="action-box" method="post" action="{% url 'action' item.pk %}">{% csrf_token %}<input type="hidden" name="version" value="{{ item.version }}"><input type="hidden" name="action" value="{{ action }}">{% if target %}<input type="hidden" name="target" value="{{ target }}">{% endif %}<label>{{ label }}{% if need_note or action == 'apply' %}<textarea name="note" rows="2" maxlength="{{ maxlength|default:'1000' }}" placeholder="{{ hint|default:'Kısa not veya gerekçe' }}" {% if need_note %}required{% endif %}></textarea>{% endif %}</label>{% if explanation %}<p class="muted"><small>{{ explanation }}</small></p>{% endif %}<button class="{% if danger %}danger-button{% else %}primary{% endif %}">{{ label }}</button></form>
